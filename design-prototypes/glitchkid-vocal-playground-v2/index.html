<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlitchKid Vocal Playground — prototype v2</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="page-head">
  <div class="ph-row">
    <div class="ph-title"><strong>GlitchKid · The Vocal Playground</strong><span>interactive prototype v2 — design only</span></div>
    <p class="ph-honest" data-testid="honesty-note">No audio runs here. Levels, analysis, speech recognition and KID's interpretation are <b>simulated</b>. Parameter IDs, ranges, defaults, the fixed processing order and the 8 factory profiles are copied from the GlitchKid source.</p>
  </div>
  <div class="sim" id="sim" role="group" aria-label="Prototype controls: simulate host and system conditions (not part of the plug-in)"></div>
</header>
<main class="stage" id="stage">
  <div class="frame-wrap" id="frameWrap">
    <div class="frame" id="frame" role="application" aria-label="GlitchKid plug-in window (prototype)"></div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
